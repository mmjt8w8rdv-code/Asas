<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS区間タイマー</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f5f7;color:#111}
header{padding:14px 16px;background:white;position:sticky;top:0;z-index:1000;border-bottom:1px solid #ddd}
h1{font-size:20px;margin:0 0 8px}.status{font-size:14px;color:#666}.wrap{padding:12px;max-width:800px;margin:auto}
#mapWrap{display:block}.map-toggle{width:100%;margin-bottom:8px;min-height:44px;border:0;border-radius:12px;background:#e9e9ed;font-size:15px;font-weight:600}#map{height:52vh;min-height:360px;border-radius:14px;overflow:hidden;border:1px solid #ddd}.map-collapsed #map{display:none}.map-collapsed .map-toggle{margin-bottom:0}
.panel{background:white;border-radius:14px;padding:14px;margin-top:12px;box-shadow:0 1px 4px #0001}
.time{font-size:72px;line-height:1.05;font-variant-numeric:tabular-nums;text-align:center;font-weight:700;margin:4px 0 8px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.buttons button{min-height:48px;border:0;border-radius:12px;background:#e9e9ed;font-size:16px;font-weight:600}.buttons .main{background:#111;color:#fff}
.info{font-size:14px;line-height:1.6}.small{font-size:12px;color:#777}
input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-bottom:8px}
ul{padding-left:20px;margin-bottom:0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.danger{color:#b00020;background:#fff0f2!important}
.lap-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lap-box{background:#f5f5f7;border-radius:12px;padding:12px;text-align:center}.lap-value{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px}
</style>
</head>
<body>
<header><h1>GPS区間タイマー</h1><div id="status" class="status">地図を読み込んでいます…</div></header>
<div class="wrap">
<div id="mapWrap"><button id="toggleMap" class="map-toggle">地図を折りたたむ ▲</button><div id="map"></div></div>

<div class="panel">
  <div class="time" id="timer">00:00.000</div>
  <div class="buttons">
    <button id="setStart">現在地をStartに設定</button>
    <button id="setFinish">現在地をFinishに設定</button>
    <button id="locate" class="main">現在地を表示</button>
    <button id="arm" class="main">計測待機</button>
    <button id="lap" class="main">ラップ記録</button>
    <button id="resetLap">ラップをリセット</button>
  </div>
  <div style="margin-top:10px">
    <b>計測モード</b>
    <select id="mode" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px;margin-top:6px">
      <option value="oneway">片道：Start → Finish</option>
      <option value="roundtrip">往復：Start → Finish → Start</option>
      <option value="lap">周回：Start → Finish → Start を繰り返す</option>
    </select>
    <button id="swap" style="width:100%;margin-top:8px;min-height:44px;border:0;border-radius:12px;background:#e9e9ed;font-size:15px;font-weight:600">Start ↔ Finish を入れ替える</button>
  </div>
  <p class="small">地図をタップしても地点を設定できます。まずStart、次にFinishを設定してください。</p>
</div>

<div class="panel">
  <div class="info"><div id="accuracyQuality" style="font-weight:700;margin-bottom:6px">GPS状態：確認中</div>
    <b>Start</b><div id="startText">未設定</div>
    <b>Finish</b><div id="finishText">未設定</div>
    <b>GPS精度</b><div id="accuracy">---</div>
  </div>
</div>

<div class="panel">
  <input id="courseName" placeholder="コース名（例：テスト区間）">
  <div class="buttons">
    <button id="save">コースを保存</button>
    <button id="clear" class="danger">地点をクリア</button>
  </div>
</div>

<div class="panel">
  <b>保存したコース</b>
  <div id="courses"><div class="small">まだありません</div></div>
  <p class="small">コースを選ぶとStart/Finishが自動設定されます。</p>
</div>

<div class="panel">
  <div class="lap-summary">
    <div class="lap-box"><div class="small">BEST LAP</div><div id="bestLap" class="lap-value">---</div></div>
    <div class="lap-box"><div class="small">FINAL LAP</div><div id="finalLap" class="lap-value">---</div></div>
  </div>
  <div style="margin:12px 0 6px"><b>ラップ履歴</b></div>
  <div id="laps"><div class="small">周回するたびにラップが記録されます。</div></div>
</div>

<div class="panel small">
  GPSは端末や環境によって数m〜数十m程度ずれることがあります。公道ではタイムアタックをせず、交通法規と安全を優先してください。
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
let map, userMarker, startMarker, finishMarker, start=null, finish=null;
let watchId=null, armed=false, running=false, startTime=0, raf=null, lastAccuracy=null;
let lapTimes=[], lastLapElapsed=0, bestAccuracy=Infinity, stableCount=0;
let mode="oneway", phase="start", lapStartTime=0, lapCount=0, finishPassed=false, finishReturnArmed=false;
const R=6371000;
function distance(a,b){
  const p=Math.PI/180, dLat=(b.lat-a.lat)*p, dLon=(b.lng-a.lng)*p;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmt(ms){let m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,x=Math.floor(ms)%1000;
 return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(x).padStart(3,'0')}
function setStatus(s){$('status').textContent=s}
function updateAccuracyUI(a){const q=$('accuracyQuality');if(!q)return; if(a<=8){q.textContent='GPS状態：良好';q.style.color='green'}else if(a<=15){q.textContent='GPS状態：使用可能';q.style.color='#8a6d00'}else{q.textContent='GPS状態：精度低下（待機推奨）';q.style.color='#b00020'}}
function updateText(){
 $('startText').textContent=start?`${start.lat.toFixed(6)}, ${start.lng.toFixed(6)}`:'未設定';
 $('finishText').textContent=finish?`${finish.lat.toFixed(6)}, ${finish.lng.toFixed(6)}`:'未設定';
}
function marker(which,p){
 const icon=L.divIcon({className:'',html:`<div style="background:${which==='start'?'#111':'#d00'};color:white;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid white">${which==='start'?'S':'F'}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
 return L.marker([p.lat,p.lng],{icon}).addTo(map);
}
function setPoint(which,p){
 if(which==='start'){start=p;if(startMarker)map.removeLayer(startMarker);startMarker=marker('start',p)}
 else {finish=p;if(finishMarker)map.removeLayer(finishMarker);finishMarker=marker('finish',p)}
 updateText(); fitPoints();
}
function fitPoints(){
 const arr=[];if(start)arr.push([start.lat,start.lng]);if(finish)arr.push([finish.lat,finish.lng]);
 if(arr.length===2)map.fitBounds(arr,{padding:[50,50]});else if(arr.length===1)map.setView(arr[0],16);
}
function useGPS(cb){
 if(!navigator.geolocation){setStatus('このブラウザでは位置情報が利用できません');return}
 setStatus('GPSを取得中…');
 navigator.geolocation.getCurrentPosition(pos=>{
  const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
  lastAccuracy=pos.coords.accuracy;$('accuracy').textContent=Math.round(lastAccuracy)+' m'; updateAccuracyUI(lastAccuracy);
  if(userMarker)userMarker.setLatLng([p.lat,p.lng]);else userMarker=L.circleMarker([p.lat,p.lng],{radius:7}).addTo(map);
  map.setView([p.lat,p.lng],16);cb(p);
 },err=>setStatus('位置情報を取得できません：'+err.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function startWatch(){
 if(watchId!==null)return;
 watchId=navigator.geolocation.watchPosition(pos=>{
  const p={lat:pos.coords.latitude,lng:pos.coords.longitude};
  lastAccuracy=pos.coords.accuracy;$('accuracy').textContent=Math.round(lastAccuracy)+' m'; updateAccuracyUI(lastAccuracy);
  if(userMarker)userMarker.setLatLng([p.lat,p.lng]);else userMarker=L.circleMarker([p.lat,p.lng],{radius:7}).addTo(map);
  const threshold=Math.max(12,Math.min(25,lastAccuracy*1.5));
  if(armed&&!running&&start&&lastAccuracy<=20&&distance(p,start)<=threshold){
   running=true;armed=false;phase="finish";startTime=performance.now();lapStartTime=startTime;finishPassed=false;finishReturnArmed=false;
   if(mode==="lap"){lapCount=0;lapTimes=[];renderLaps();}
   setStatus(mode==="oneway"?'計測中…':mode==="roundtrip"?'往路計測中…':'周回計測中…');tick();
  }
  const dStart=start?distance(p,start):Infinity;
  const dFinish=finish?distance(p,finish):Infinity;
  if(running&&phase==="finish"&&finish&&dFinish<=threshold){
   if(mode==="oneway"){
     running=false;cancelAnimationFrame(raf);const t=performance.now()-startTime;$('timer').textContent=fmt(t);
     $('finalLap').textContent=fmt(t);
     setStatus('Finish通過。タイム '+fmt(t));saveResult(t);
   } else if(mode==="roundtrip"){
     // 往路のFinishを通過。いったんFinish地点から離れてから、もう一度Finishを通過する。
     phase="finishReturn";finishReturnArmed=false;
     setStatus('Finish通過。Uターン後、もう一度Finishを通過してください');
   } else {
     phase="start";
     setStatus('Finish通過。Startへ戻るとLap '+(lapCount+1)+' 完了');
   }
  }
  if(running&&mode==="roundtrip"&&phase==="finishReturn"){
   if(!finishReturnArmed && dFinish>Math.max(threshold*1.8,20)) finishReturnArmed=true;
   if(finishReturnArmed && dFinish<=threshold){
     phase="start";
     setStatus('Finishを復路でも通過。Startへ戻ってください');
   }
  }
  if(running&&phase==="start"&&start&&dStart<=threshold){
   const now=performance.now();
   if(mode==="roundtrip"){
     running=false;cancelAnimationFrame(raf);const t=now-startTime;$('timer').textContent=fmt(t);
     $('finalLap').textContent=fmt(t);
     setStatus('往復完了。タイム '+fmt(t));saveResult(t);
   } else if(mode==="lap"){
     const lap=now-lapStartTime;lapCount++;lapTimes.push(lap);lastLapElapsed=now-startTime;
     $('timer').textContent=fmt(lastLapElapsed);renderLaps();
     lapStartTime=now;phase="finish";
     setStatus('Lap '+lapCount+' 完了：'+fmt(lap)+'　次の周回を計測中…');
   }
  }
 },err=>setStatus('GPSエラー：'+err.message),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function tick(){if(!running)return;$('timer').textContent=fmt(performance.now()-startTime);raf=requestAnimationFrame(tick)}
function saveResult(t){
 const key='gpsTimerResults', arr=JSON.parse(localStorage.getItem(key)||'[]');
 arr.push({name:$('courseName').value||'無題',time:t,date:new Date().toLocaleString('ja-JP')});
 localStorage.setItem(key,JSON.stringify(arr.slice(-100)));renderResults();
}
function renderResults(){
 const arr=JSON.parse(localStorage.getItem('gpsTimerResults')||'[]').slice().reverse();
 $('courses').innerHTML=arr.length?arr.map(x=>`<div style="padding:6px 0;border-bottom:1px solid #eee"><b>${x.name}</b> — ${fmt(x.time)} <span class="small">(${x.date})</span></div>`).join(''):'<div class="small">まだありません</div>';
}
$('setStart').onclick=()=>useGPS(p=>{setPoint('start',p);startWatch();setStatus('Startを設定しました')});
$('setFinish').onclick=()=>useGPS(p=>{setPoint('finish',p);startWatch();setStatus('Finishを設定しました')});
$('locate').onclick=()=>useGPS(()=>setStatus('現在地を表示しました'));
$('mode').onchange=e=>{mode=e.target.value;armed=false;running=false;phase='start';finishPassed=false;finishReturnArmed=false;cancelAnimationFrame(raf);$('timer').textContent='00:00.000';resetLaps();setStatus('モードを変更しました：'+e.target.options[e.target.selectedIndex].text)};
$('swap').onclick=()=>{if(!start||!finish){setStatus('StartとFinishを先に設定してください');return}const t=start;start=finish;finish=t;if(startMarker)map.removeLayer(startMarker);if(finishMarker)map.removeLayer(finishMarker);startMarker=marker('start',start);finishMarker=marker('finish',finish);updateText();fitPoints();setStatus('StartとFinishを入れ替えました')};
$('arm').onclick=()=>{
 if(!start||!finish){setStatus('StartとFinishを先に設定してください');return}
 startWatch();armed=true;running=false;phase='start';finishPassed=false;finishReturnArmed=false;lapCount=0;lapStartTime=0;$('timer').textContent='00:00.000';resetLaps();setStatus('計測待機中。Start地点を通過すると開始します');
};
$('clear').onclick=()=>{start=finish=null;if(startMarker)map.removeLayer(startMarker);if(finishMarker)map.removeLayer(finishMarker);startMarker=finishMarker=null;armed=running=false;phase='start';finishPassed=false;finishReturnArmed=false;cancelAnimationFrame(raf);updateText();$('timer').textContent='00:00.000';resetLaps();setStatus('地点をクリアしました')};
$('lap').onclick=recordLap;
$('toggleMap').onclick=()=>{const w=$('mapWrap');w.classList.toggle('map-collapsed');$('toggleMap').textContent=w.classList.contains('map-collapsed')?'地図を表示 ▼':'地図を折りたたむ ▲';if(!w.classList.contains('map-collapsed'))setTimeout(()=>map.invalidateSize(),100)};
$('resetLap').onclick=()=>{resetLaps();setStatus('ラップをリセットしました')};
$('save').onclick=()=>{
 if(!start||!finish){setStatus('StartとFinishを設定してください');return}
 const key='gpsTimerCourses',arr=JSON.parse(localStorage.getItem(key)||'[]');
 arr.push({name:$('courseName').value||'無題',start,finish,mode});
 localStorage.setItem(key,JSON.stringify(arr));renderCourses();setStatus('コースを端末に保存しました');
};
function loadCourses(){return JSON.parse(localStorage.getItem('gpsTimerCourses')||'[]')}
function renderCourses(){
 const arr=loadCourses();
 $('courses').innerHTML=arr.length?arr.map((x,i)=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${x.name}</b><div class="small">${x.mode==='roundtrip'?'往復':x.mode==='lap'?'周回':'片道'}</div><div class="buttons" style="margin-top:6px"><button onclick="applyCourse(${i})">このコースを設定</button><button class="danger" onclick="deleteCourse(${i})">削除</button></div></div>`).join(''):'<div class="small">まだありません</div>';
}
function applyCourse(i){
 const x=loadCourses()[i];if(!x)return;
 setPoint('start',x.start);setPoint('finish',x.finish);
 mode=x.mode||'oneway';$('mode').value=mode;
 armed=false;running=false;phase='start';cancelAnimationFrame(raf);$('timer').textContent='00:00.000';resetLaps();
 $('courseName').value=x.name;setStatus('コースを設定しました：'+x.name);
}
function deleteCourse(i){const arr=loadCourses();arr.splice(i,1);localStorage.setItem('gpsTimerCourses',JSON.stringify(arr));renderCourses();}
function resetLaps(){lapTimes=[];lastLapElapsed=0;lapCount=0;$('bestLap').textContent='---';$('finalLap').textContent='---';$('laps').innerHTML='<div class="small">周回するたびにラップが記録されます。</div>'}
function recordLap(){
 if(!running){setStatus('計測中のみラップを記録できます');return}
 const now=performance.now(),elapsed=now-startTime,lap=elapsed-lastLapElapsed;lapTimes.push(lap);lastLapElapsed=elapsed;lapCount=lapTimes.length;renderLaps();setStatus('Lap '+lapCount+'：'+fmt(lap));
}
function renderLaps(){
 if(!lapTimes.length){$('laps').innerHTML='<div class="small">まだありません</div>';$('bestLap').textContent='Best: ---';return}
 const best=Math.min(...lapTimes), final=lapTimes[lapTimes.length-1];$('bestLap').textContent=fmt(best);$('finalLap').textContent=fmt(final);$('laps').innerHTML=lapTimes.map((t,i)=>`<div class="row" style="padding:7px 0;border-bottom:1px solid #eee"><span>Lap ${i+1}</span><b>${fmt(t)}</b></div>`).join('');
}
function init(){
 map=L.map('map').setView([36.695,137.21],11);
 L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
 map.on('click',e=>{
  const p={lat:e.latlng.lat,lng:e.latlng.lng};
  if(!start)setPoint('start',p);else if(!finish)setPoint('finish',p);else setPoint('start',p);
 });
 renderResults();renderCourses();renderLaps();updateText();
 if(navigator.geolocation){startWatch();setStatus('地図をタップしてStart/Finishを設定できます')}
 else setStatus('位置情報が利用できません');
}
init();
</script>
</body>
</html>
